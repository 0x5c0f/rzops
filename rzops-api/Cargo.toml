[workspace]
resolver = "2"
members = [
    "app",
    "server",
    "api",
    "domain",
    "infra",
    "config",
    "common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "rust_decimal",
] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Common types
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Password hashing
bcrypt = "0.17"

# JWT
jsonwebtoken = "9"

# OpenAPI / Swagger UI
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tower middleware
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Internal crates
rzops-common = { path = "common" }
rzops-config = { path = "config" }
rzops-domain = { path = "domain" }
rzops-infra = { path = "infra" }
rzops-api = { path = "api" }
rzops-server = { path = "server" }
